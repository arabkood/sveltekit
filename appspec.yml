version: 0.0
os: linux

files:
  - source: /build
    destination: /opt/svelte-app/build
  - source: /package.json
    destination: /opt/svelte-app
  - source: /package-lock.json
    destination: /opt/svelte-app
  - source: /scripts
    destination: /opt/svelte-app/scripts

hooks:
  ApplicationStop:
    - location: /opt/svelte-app/scripts/application_stop.sh
      timeout: 60
      runas: ec2-user

  # BeforeInstall: # Optional: Use if you need to run commands BEFORE files are copied
  #   - location: scripts/before_install.sh
  #     timeout: 120
  #     runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: ec2-user

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 120
      runas: ec2-user

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: ec2-user
